# crowdsec-bouncer.conf — CrowdSec firewall bouncer configuration template.
#
# Part of the 0x10debug monitor-stack:
# https://github.com/0x10debug/monitor-stack
#
# This file is the source of truth for the crowdsec-firewall-bouncer that ships
# in compose/crowdsec.yml. It is bind-mounted into the bouncer container at
# /etc/crowdsec/bouncers/crowdsec-firewall-bouncer.yaml.
#
# The bouncer reads decisions from the CrowdSec Local API (LAPI) and enforces
# them at the firewall level — dropping or rejecting traffic from IPs CrowdSec
# has flagged as malicious.
#
# Deployment notes:
#   1. Register the bouncer with the LAPI first:
#        docker exec crowdsec cscli bouncers add mb-firewall -o raw
#      Copy the printed key into CROWDSEC_BOUNCER_KEY in your .env.
#   2. Pick a backend that matches your host firewall (nftables is the modern
#      default on Debian 12+/Ubuntu 22.04+; iptables for older hosts).
#   3. Recreate the bouncer container:
#        docker compose -f compose/crowdsec.yml up -d crowdsec-bouncer
#   4. Verify:
#        docker exec crowdsec cscli bouncers list

mode: live

# The LAPI URL. Because the bouncer runs with network_mode: host, it reaches
# the crowdsec container via the host's loopback interface on the LAPI port.
api_url: http://127.0.0.1:8080
# Shared secret — injected from the CROWDSEC_BOUNCER_KEY env var at runtime.
api_key: ${BOUNCER_KEY}

# How often (in seconds) the bouncer polls the LAPI for new/removed decisions.
update_frequency: 10s

# Firewall backend. Valid values:
#   nftables  — modern default (Debian 12+, Ubuntu 22.04+, kernel >= 5.8)
#   iptables  — legacy hosts and most container hosts without nftables
#   ipset     — uses ipset + iptables (useful when nftables is unavailable)
#   pf        — OpenBSD / FreeBSD only
# Switch to "iptables" if your host kernel lacks the nftables modules.
daemon: true

# Decision enforcement. "drop" silently discards packets; "reject" sends a
# TCP RST / ICMP port-unreachable back to the attacker. "reject" is noisier
# for the attacker but uses slightly more bandwidth. "drop" is recommended.
decision_type: drop

# Log destination: stdout (captured by docker logs) or a file path.
log_media: stdout
log_level: info

# Disable the bouncer's own log rotation — docker handles log retention via
# the json-file driver and its --log-opt max-size setting.
log_compression: true

# Backends. Only the active backend (selected by the "daemon" + runtime
# detection) is used; the rest are ignored. Keep both so the same template
# works across hosts without edits.
nftables:
  # nftables set name and table. Defaults match the upstream bouncer.
  set-only: false
  table: crowdsec
  chain: crowdsec-chain

iptables:
  # iptables backend — used when nftables is not available.
  ipv4:
    enabled: true
    chain: CROWDSEC
    set: crowdsec-blacklists
  ipv6:
    enabled: true
    chain: CROWDSEC6
    set: crowdsec6-blacklists

# Prometheus metrics endpoint — optional. Uncomment to expose bouncer stats
# (active decisions, LAPI poll latency) for scraping by your monitoring stack.
# prometheus:
#   enabled: true
#   listen_addr: 0.0.0.0:6060
#   listen_path: /metrics
