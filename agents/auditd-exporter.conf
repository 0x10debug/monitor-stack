# auditd-exporter.conf — auditd log forwarding configuration template.
#
# Part of the 0x10debug monitor-stack:
# https://github.com/0x10debug/monitor-stack
#
# This template configures rsyslog to stream auditd events into the
# monitor-stack's log aggregation layer. Two downstream targets are supported
# and documented below — enable the one that matches your stack:
#
#   A. Loki + Promtail  — the recommended path for the monitor-stack. Promtail
#      tails the forwarded audit log file and ships it to Loki, where it can
#      be queried from Grafana alongside CrowdSec and service logs.
#
#   B. Elasticsearch / OpenSearch — for stacks that already run an ES cluster.
#      rsyslog ships structured JSON via the omelasticsearch output module.
#
# Deployment steps:
#   1. Install rsyslog and the audit daemon on the monitored node:
#        sudo apt install -y rsyslog auditd
#   2. Make sure auditd writes events to /var/log/audit/audit.log (the
#      default). Verify with: sudo aureport --summary
#   3. Copy this template to /etc/rsyslog.d/60-auditd-exporter.conf and edit
#      the variables in the "TARGET" section below.
#   4. Restart rsyslog:
#        sudo systemctl restart rsyslog
#   5. Verify delivery at the downstream (Loki log query or ES index).
#
# Why rsyslog and not filebeat? rsyslog is present on virtually every Linux
# host, has no external runtime dependency, and can forward to both Loki
# (via a local Promtail tailing the spool file) and Elasticsearch natively.
# This keeps the agent footprint minimal on monitored nodes.

# ─── Source: tail the auditd log file ──────────────────────────────────────
# imfile lets rsyslog read a file line-by-line as if it were a syslog source.
module(load="imfile")

input(type="imfile"
      File="/var/log/audit/audit.log"
      Tag="auditd"
      Severity="info"
      Facility="local6"
      # Persist read offset across restarts so events are not duplicated or lost.
      StateFile="auditd-exporter-state"
      # audit.log lines can be long (full syscall arg blobs); do not truncate.
      escapeLF="off")

# ─── Enrich: tag every audit event so downstream can route it ───────────────
# local6.* is the facility used by the imfile input above. We set a stable
# program name so Promtail/Loki can match on the "auditd" label and
# Elasticsearch can route to a dedicated index.
local6.* {
    set $.audit_host = getenv("HOSTNAME");
    if ($.audit_host == "") then {
        set $.audit_host = "unknown";
    }
    template(name="AuditJson" type="list" option.jsonf="on") {
        property(outname="timestamp" dateFormat="rfc3339" format="jsonf")
        property(outname="host"      value="$.audit_host"  format="jsonf")
        property(outname="facility"  value="local6"        format="jsonf")
        property(outname="program"   value="auditd"        format="jsonf")
        property(outname="message"   value="msg"           format="jsonf")
    }

    # ─── TARGET A: Loki via Promtail (recommended) ──────────────────────────
    # Promtail tails this spool file and ships it to Loki. Point Promtail at
    # /var/log/auditd-exporter/auditd.jsonl with a static job label of
    # "auditd". No rsyslog network output is needed — Promtail handles
    # batching, retries, and Loki label enrichment.
    action(type="omfile"
           file="/var/log/auditd-exporter/auditd.jsonl"
           template="AuditJson"
           createDirs="on")

    # ─── TARGET B: Elasticsearch / OpenSearch (optional) ───────────────────
    # Uncomment and fill in ES_HOST / ES_PORT to ship directly. Requires the
    # omelasticsearch output module (rsyslog-elasticsearch package on Debian).
    # action(type="omelasticsearch"
    #        server=["ES_HOST"]
    #        serverport="ES_PORT"
    #        searchIndex="auditd-index"
    #        searchType="_doc"
    #        template="AuditJson"
    #        bulkmode="on"
    #        queue.type="LinkedList"
    #        queue.size="5000"
    #        queue.dequeuebatchsize="300"
    #        action.resumeretrycount="-1")

    stop
}

# ─── Spool directory creation hint ─────────────────────────────────────────
# rsyslog will create /var/log/auditd-exporter/ automatically (createDirs="on"),
# but if your host uses strict permissions, pre-create it:
#   sudo mkdir -p /var/log/auditd-exporter
#   sudo chown syslog:adm /var/log/auditd-exporter
#   sudo chmod 0750 /var/log/auditd-exporter
