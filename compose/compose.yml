# monitor-stack — Uptime Kuma + Beszel Hub
# Part of the 0x10debug VPS tool suite
# https://github.com/0x10debug/monitor-stack

networks:
  mb-proxy:
    external: true
    name: ${MB_PROXY_NETWORK:-mb-proxy}

services:
  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    ports:
      - "${UPTIME_KUMA_PORT:-3001}:3001"
    volumes:
      - /data/uptime-kuma:/app/data
    networks:
      - mb-proxy

  beszel-hub:
    image: henrygd/beszel:latest
    container_name: beszel-hub
    restart: unless-stopped
    ports:
      - "${BESZEL_HUB_PORT:-8090}:8090"
    volumes:
      - /data/beszel:/beszel_data
    environment:
      - PORT=8090
    networks:
      - mb-proxy
